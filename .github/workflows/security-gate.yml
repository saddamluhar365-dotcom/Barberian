name: security-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run security gate
        run: |
          python - <<'PY'
          import json
          from barberian.security_gate import run_security_gate, Severity
          report = run_security_gate('.')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          if report['summary']['CRITICAL'] or report['summary']['HIGH']:
              raise SystemExit(1)
          PY

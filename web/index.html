<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Barberian</title>
<style>
:root{--bg:#000;--panel:#080808;--hover:#171717;--border:#252525;--text:#fff;--muted:#999;--dim:#666;--user:#202020;--input:#151515;--shadow:0 10px 40px rgba(0,0,0,.6)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{overflow:hidden}button,textarea{font:inherit}button{color:inherit;cursor:pointer}.app{display:flex;width:100%;height:100dvh;background:#000}.sidebar{width:280px;flex:0 0 280px;background:#080808;border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30;transition:transform .2s ease}.side-top{padding:12px}.brand{height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;font-weight:700}.brand-mark{width:28px;height:28px;border:1px solid #444;border-radius:9px;display:grid;place-items:center;font-weight:800}.new-chat{width:100%;height:44px;border:1px solid #303030;background:#101010;border-radius:10px;text-align:left;padding:0 13px;display:flex;align-items:center;gap:10px;font-weight:600}.new-chat:hover,.nav-btn:hover,.history-item:hover{background:var(--hover)}.plus{font-size:21px}.history{flex:1;overflow:auto;padding:8px}.history-label{padding:10px;color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.history-item{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:9px;padding:10px;color:#ccc;text-align:left;font-size:13px}.history-item.active{background:#181818;color:#fff}.history-item span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sidebar-foot{padding:8px;border-top:1px solid var(--border)}.nav-btn{width:100%;height:42px;border:0;background:transparent;border-radius:9px;display:flex;align-items:center;gap:10px;padding:0 11px;color:#bbb;text-align:left}.main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;position:relative;background:#000}.topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid #171717;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);z-index:10}.top-title{font-size:14px;font-weight:600;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-status{margin-left:auto;color:#666;font-size:11px}.icon-btn{width:38px;height:38px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:#aaa}.icon-btn:hover{background:#161616;color:#fff}.desktop-toggle{display:grid}.mobile-menu{display:none}.chat{flex:1;overflow:auto;scroll-behavior:smooth}.messages{width:min(850px,100%);margin:auto;padding:34px 24px 170px}.welcome{min-height:calc(100dvh - 250px);display:grid;place-items:center;text-align:center}.welcome-inner{width:min(620px,100%)}.welcome-logo{width:64px;height:64px;margin:0 auto 22px;border:1px solid #444;border-radius:20px;display:grid;place-items:center;font-size:25px;font-weight:800;background:#050505}.welcome h1{font-size:30px;line-height:1.2;margin:0 0 10px;letter-spacing:-.03em}.welcome p{color:#8d8d8d;margin:0;line-height:1.6;font-size:14px}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px}.suggestion{min-height:58px;border:1px solid #262626;background:#0b0b0b;border-radius:12px;padding:12px 14px;text-align:left;color:#ddd}.suggestion:hover{background:#151515;border-color:#3a3a3a}.suggestion b{display:block;font-size:13px;margin-bottom:4px}.suggestion span{font-size:11px;color:#777}.message{display:flex;gap:12px;margin:30px 0;animation:up .16s ease}.message.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:9px;border:1px solid #333;background:#111;display:grid;place-items:center;font-size:9px;font-weight:800;color:#ddd}.message.user .avatar{order:2;background:#222}.message-body{min-width:0;max-width:78%}.bubble{font-size:15px;line-height:1.72;overflow-wrap:anywhere}.message.user .bubble{background:var(--user);border-radius:18px;padding:10px 15px;color:#f5f5f5}.assistant .bubble{padding-top:1px}.meta{display:flex;align-items:center;gap:9px;margin-top:8px;color:#606060;font-size:10px}.copy-btn{border:0;background:transparent;color:#666;padding:0}.copy-btn:hover{color:#fff}pre{margin:12px 0;padding:14px;overflow:auto;border:1px solid #292929;border-radius:11px;background:#090909}code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}blockquote{border-left:2px solid #555;margin:12px 0;padding-left:13px;color:#aaa}.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:22px 20px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 28%);z-index:12}.composer{width:min(850px,100%);margin:auto}.composer-box{display:flex;align-items:flex-end;gap:6px;min-height:58px;padding:8px 8px 8px 10px;background:var(--input);border:1px solid #303030;border-radius:18px;box-shadow:var(--shadow)}.composer-box:focus-within{border-color:#444}.attach,.send{width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:0;display:grid;place-items:center}.attach{background:transparent;color:#888}.attach:hover{background:#252525;color:#fff}.send{background:#fff;color:#000}.send:disabled{opacity:.3;cursor:not-allowed}.composer textarea{flex:1;min-width:0;min-height:40px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:9px 5px;line-height:1.45}.composer textarea::placeholder{color:#777}.hint{text-align:center;color:#555;font-size:10px;padding-top:8px}.panel{position:absolute;inset:58px 0 0;background:#000;overflow:auto;padding:30px;z-index:8}.panel.hidden{display:none}.panel-inner{width:min(900px,100%);margin:auto}.panel h2{font-size:24px;margin:0 0 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#0b0b0b;border:1px solid #242424;border-radius:13px;padding:16px}.card strong{display:block;margin-bottom:7px}.muted{color:#777}.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,12px);background:#fff;color:#000;padding:9px 13px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}.typing{display:inline-flex;gap:4px;align-items:center}.typing i{width:5px;height:5px;border-radius:50%;background:#aaa;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.25}}@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-105%);box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.desktop-toggle{display:none}.mobile-menu{display:grid}.overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:25}.overlay.hidden{display:none}.messages{padding:24px 14px 155px}.message-body{max-width:88%}.welcome{min-height:calc(100dvh - 220px)}.welcome h1{font-size:25px}.suggestions{grid-template-columns:1fr}.composer-wrap{padding:14px 10px max(12px,env(safe-area-inset-bottom))}.topbar{padding:0 9px}.top-status{display:none}.panel{padding:20px 14px}}
</style>
</head>
<body>
<div class="app" id="app"><aside class="sidebar" id="sidebar"><div class="side-top"><div class="brand"><div class="brand-mark">B</div><span>Barberian</span></div><button class="new-chat" id="newChat"><span class="plus">＋</span><span>New chat</span></button></div><div class="history" id="history"><div class="history-label">Chats</div></div><div class="sidebar-foot"><button class="nav-btn" data-module="Settings"><span>⚙</span><span>Settings</span></button></div></aside><div class="overlay hidden" id="overlay"></div><main class="main"><header class="topbar"><button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button><button class="icon-btn desktop-toggle" id="desktopToggle" aria-label="Toggle sidebar">☰</button><div class="top-title" id="title">New chat</div><div class="top-status" id="status">Connecting…</div><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button></header><section class="chat" id="chat"><div class="messages" id="messages"></div></section><section class="panel hidden" id="panel"></section><div class="composer-wrap"><form class="composer" id="composer"><div class="composer-box"><button type="button" class="attach" id="attach" aria-label="Attach file">＋</button><textarea id="input" rows="1" placeholder="Message Barberian…" aria-label="Message Barberian"></textarea><button type="submit" class="send" id="send" aria-label="Send" disabled>↑</button></div><div class="hint">Barberian can research, plan, code, create, automate, and execute.</div></form></div></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),sidebar=$('#sidebar'),overlay=$('#overlay'),messages=$('#messages'),input=$('#input'),send=$('#send'),status=$('#status'),title=$('#title'),panel=$('#panel'),history=$('#history'),chat=$('#chat'),themeToggle=$('#themeToggle');const modules=['Projects','Files','Tasks','MCP','Skills','APIs','Models','Tools','Research','Media','Code','GitHub','Sandbox','Logs','Usage','Security','Settings'];let conversations=JSON.parse(localStorage.getItem('barberian_chats')||'[]'),currentId=null,busy=false;
function save(){localStorage.setItem('barberian_chats',JSON.stringify(conversations.slice(-50)))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderMarkdown(text){let s=escapeHtml(text);s=s.replace(/```([\s\S]*?)```/g,(_,x)=>'<pre><code>'+x.trim()+'</code></pre>');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>');s=s.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');return s.replace(/\n/g,'<br>')}function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function renderHistory(){history.querySelectorAll('.history-item').forEach(x=>x.remove());if(!conversations.length){const e=document.createElement('div');e.className='muted';e.style.padding='12px 10px';e.textContent='No previous chats';history.append(e);return}conversations.slice().reverse().forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===currentId?' active':'');b.innerHTML='<span>◦</span><span>'+escapeHtml(c.title||'New chat')+'</span>';b.onclick=()=>loadChat(c.id);history.append(b)})}function welcome(){messages.innerHTML='<div class="welcome"><div class="welcome-inner"><div class="welcome-logo">B</div><h1>How can I help?</h1><p>Ask Barberian to research, plan, code, create, automate, or execute.</p><div class="suggestions"><button class="suggestion" data-prompt="Research this topic and give me the key findings."><b>Research</b><span>Find and synthesize key information</span></button><button class="suggestion" data-prompt="Plan this project step by step."><b>Plan</b><span>Turn an idea into an actionable plan</span></button><button class="suggestion" data-prompt="Review this code and find potential problems."><b>Code</b><span>Review, debug, and improve code</span></button><button class="suggestion" data-prompt="Create a practical automation workflow for this task."><b>Automate</b><span>Design a reliable workflow</span></button></div></div></div>';document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;resize();updateSend();input.focus()})}function messageNode(role,text,meta=''){const row=document.createElement('div');row.className='message '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'YOU':'B';const body=document.createElement('div');body.className='message-body';const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML=role==='assistant'?renderMarkdown(text):escapeHtml(text).replace(/\n/g,'<br>');body.append(bubble);if(meta){const m=document.createElement('div');m.className='meta';m.innerHTML='<span>'+escapeHtml(meta)+'</span>';if(role==='assistant'){const c=document.createElement('button');c.className='copy-btn';c.textContent='Copy';c.onclick=()=>copyMessage(text);m.append(c)}body.append(m)}row.append(av,body);messages.append(row);return bubble}function copyMessage(text){navigator.clipboard?.writeText(text).then(()=>toast('Copied')).catch(()=>toast('Copy unavailable'))}function current(){return conversations.find(c=>c.id===currentId)}function loadChat(id){const c=conversations.find(x=>x.id===id);if(!c)return;currentId=id;title.textContent=c.title||'New chat';panel.classList.add('hidden');messages.innerHTML='';c.messages.forEach(m=>messageNode(m.role,m.text,m.meta));renderHistory();closeMobile();setTimeout(()=>chat.scrollTop=chat.scrollHeight,0)}function newChat(){currentId=null;title.textContent='New chat';panel.classList.add('hidden');welcome();renderHistory();closeMobile()}function ensureChat(firstText){if(currentId)return current();const c={id:uid(),title:firstText.slice(0,48),messages:[]};conversations.push(c);currentId=c.id;return c}function addStored(c,role,text,meta=''){c.messages.push({role,text,meta});save();renderHistory()}async function sendMessage(text){if(busy||!text.trim())return;const clean=text.trim(),c=ensureChat(clean);if(messages.querySelector('.welcome'))messages.innerHTML='';addStored(c,'user',clean);messageNode('user',clean);const bubble=messageNode('assistant','');bubble.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';busy=true;send.disabled=true;input.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});const j=await r.json();if(!r.ok)throw new Error(j.error||j.message||'Request failed');const answer=j.data??j.message??JSON.stringify(j,null,2);bubble.innerHTML=renderMarkdown(answer);const meta=[j.provider,j.model,j.latency_ms!=null?j.latency_ms+'ms':null].filter(Boolean).join(' · ');if(meta){const row=bubble.parentElement,m=document.createElement('div');m.className='meta';m.innerHTML='<span>'+escapeHtml(meta)+'</span>';const cp=document.createElement('button');cp.className='copy-btn';cp.textContent='Copy';cp.onclick=()=>copyMessage(answer);m.append(cp);row.append(m)}addStored(c,'assistant',answer,meta);if(j.run_id)events(j.run_id)}catch(e){bubble.innerHTML='<strong>Request failed.</strong><br>'+escapeHtml(e.message);addStored(c,'assistant','Request failed: '+e.message)}finally{busy=false;input.disabled=false;updateSend();input.focus();setTimeout(()=>chat.scrollTop=chat.scrollHeight,0)}}function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'}function updateSend(){send.disabled=busy||!input.value.trim()}function closeMobile(){sidebar.classList.remove('open');overlay.classList.add('hidden')}function openPanel(name){panel.classList.remove('hidden');panel.innerHTML='<div class="panel-inner"><h2>'+escapeHtml(name)+'</h2><div class="cards"><div class="card"><strong>'+escapeHtml(name)+'</strong><span class="muted">Barberian module interface</span></div><div class="card"><strong>Status</strong><span class="muted">Available through the Barberian API</span></div></div></div>';closeMobile()}async function health(){try{const r=await fetch('/api/health',{cache:'no-store'});if(!r.ok)throw new Error();status.textContent='Online'}catch{status.textContent='Offline'}}async function events(runId){try{await fetch('/api/events?run_id='+encodeURIComponent(runId),{cache:'no-store'})}catch{}}
$('#newChat').onclick=newChat;$('#mobileMenu').onclick=()=>{sidebar.classList.add('open');overlay.classList.remove('hidden')};overlay.onclick=closeMobile;$('#desktopToggle').onclick=()=>sidebar.classList.toggle('collapsed');themeToggle.onclick=()=>toast('AMOLED dark mode is active');$('#attach').onclick=()=>toast('File upload coming soon');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>openPanel(b.dataset.module));$('#composer').onsubmit=e=>{e.preventDefault();const text=input.value;input.value='';resize();updateSend();sendMessage(text)};input.addEventListener('input',()=>{resize();updateSend()});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});welcome();renderHistory();health();setInterval(health,30000);
</script>
</body>
</html>

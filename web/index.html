<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Barberian universal AI agent">
<title>Barberian</title>
<style>
:root{--black:#000;--surface:#050505;--surface2:#0b0b0b;--surface3:#111;--line:#202020;--line2:#2b2b2b;--white:#fff;--text:#f5f5f5;--muted:#a0a0a0;--dim:#666;--sidebar:272px;--content:900px;--r:14px;--speed:160ms ease}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow:hidden}button,input,textarea{font:inherit}button{border:0;cursor:pointer;color:#fff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hidden{display:none!important}.app{height:100dvh;width:100%;display:flex;background:#000}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);height:100%;display:flex;flex-direction:column;background:#000;border-right:1px solid var(--line);transition:width var(--speed),flex-basis var(--speed),transform var(--speed);z-index:60}
.sidebar.collapsed{width:0;flex-basis:0;overflow:hidden;border:0}.sidebar-head{padding:14px 12px 10px}.brand{height:40px;display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:11px}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid #444;border-radius:9px;background:#000;font-size:12px;font-weight:800}.brand-name{font-size:15px;font-weight:750;letter-spacing:-.02em}.new-chat{height:42px;width:100%;display:flex;align-items:center;gap:10px;padding:0 13px;border:1px solid #292929;border-radius:11px;background:#0b0b0b;color:#fff;text-align:left;font-size:13px;font-weight:650;transition:background var(--speed),border-color var(--speed)}.new-chat:hover{background:#151515;border-color:#444}.new-chat svg{width:17px;height:17px;flex:none}
.history{flex:1;min-height:0;overflow:auto;padding:7px 9px;scrollbar-width:thin;scrollbar-color:#292929 transparent}.history-label{padding:12px 9px 7px;color:#fff;font-size:10px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.history-item{height:40px;width:100%;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:9px;background:transparent;color:#bdbdbd;text-align:left;font-size:12.5px;transition:background var(--speed),color var(--speed)}.history-item:hover{background:#0d0d0d;color:#fff}.history-item.active{background:#171717;color:#fff}.history-item .dot{width:5px;height:5px;border-radius:50%;background:#555;flex:none}.history-item.active .dot{background:#fff}.history-item .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty-history{padding:12px 9px;color:#666;font-size:12px}.sidebar-foot{padding:9px;border-top:1px solid var(--line)}.nav-btn{height:40px;width:100%;display:flex;align-items:center;gap:10px;padding:0 11px;border-radius:9px;background:transparent;color:#aaa;text-align:left;font-size:12.5px;transition:background var(--speed),color var(--speed)}.nav-btn:hover{background:#0d0d0d;color:#fff}.nav-btn svg{width:17px;height:17px;color:#aaa;flex:none}
.main{position:relative;min-width:0;flex:1;height:100%;display:flex;flex-direction:column;background:#000}.topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:8px;padding:0 15px;background:#000;border-bottom:1px solid var(--line);z-index:30}.topbar-title{min-width:0;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;font-size:13px;font-weight:650}.topbar-spacer{flex:1}.status{display:flex;align-items:center;gap:7px;margin-right:3px;color:#aaa;font-size:10px}.status-dot{width:6px;height:6px;border-radius:50%;background:#666}.status.online .status-dot{background:#fff}.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:transparent;color:#aaa;transition:background var(--speed),color var(--speed)}.icon-btn:hover{background:#111;color:#fff}.icon-btn svg{width:18px;height:18px}.mobile-menu{display:none}
.chat{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#292929 transparent}.messages{width:min(var(--content),100%);margin:0 auto;padding:32px 26px 180px}.welcome{min-height:calc(100dvh - 270px);display:flex;align-items:center;justify-content:center;text-align:center}.welcome-inner{width:min(720px,100%);padding:24px 0}.welcome-mark{width:62px;height:62px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid #444;border-radius:18px;background:#000;color:#fff;font-size:22px;font-weight:850}.welcome h1{margin:0;color:#fff;font-size:31px;line-height:1.15;letter-spacing:-.04em}.welcome-subtitle{max-width:570px;margin:11px auto 0;color:#aaa;font-size:13px;line-height:1.65}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:28px;text-align:left}.quick-card{min-height:105px;padding:15px;border:1px solid #202020;border-radius:13px;background:#050505;color:#fff;text-align:left;transition:background var(--speed),border-color var(--speed),transform var(--speed)}.quick-card:hover{background:#0d0d0d;border-color:#444;transform:translateY(-1px)}.quick-card:active{transform:none}.quick-icon{width:28px;height:28px;display:grid;place-items:center;margin-bottom:13px;border:1px solid #333;border-radius:8px}.quick-icon svg{width:15px;height:15px}.quick-title{display:block;font-size:12.5px;font-weight:700}.quick-desc{display:block;margin-top:5px;color:#8f8f8f;font-size:10.5px;line-height:1.45}
.message{display:flex;gap:12px;margin:29px 0}.message.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border:1px solid #333;border-radius:9px;background:#000;color:#fff;font-size:9px;font-weight:800}.message.user .avatar{order:2;background:#151515}.message-body{min-width:0;max-width:84%}.bubble{color:#f1f1f1;font-size:14px;line-height:1.75;overflow-wrap:anywhere}.message.user .bubble{padding:10px 14px;border-radius:17px;background:#151515;color:#fff}.bubble h1,.bubble h2,.bubble h3{color:#fff;line-height:1.3}.bubble h1{font-size:21px}.bubble h2{font-size:18px;margin:17px 0 7px}.bubble h3{font-size:15px;margin:15px 0 6px}.bubble strong{color:#fff}.bubble a{color:#fff;text-decoration:underline;text-underline-offset:3px}.bubble code{padding:2px 5px;border-radius:5px;background:#151515;color:#fff;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.bubble pre{margin:13px 0;padding:15px;overflow:auto;border:1px solid #292929;border-radius:11px;background:#050505}.bubble pre code{padding:0;background:transparent;color:#eee;font-size:12px;line-height:1.6;white-space:pre}.bubble ul,.bubble ol{padding-left:22px}.bubble li{margin:4px 0}.bubble blockquote{margin:12px 0;padding:2px 0 2px 13px;border-left:2px solid #555;color:#aaa}.meta{display:flex;align-items:center;gap:10px;margin-top:7px;color:#666;font-size:10px}.copy-btn{padding:0;background:transparent;color:#777;font-size:10px}.copy-btn:hover{color:#fff}.typing{display:inline-flex;align-items:center;gap:4px;height:20px}.typing i{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:20px 20px max(16px,env(safe-area-inset-bottom));background:#000;z-index:25}.composer{width:min(var(--content),100%);margin:0 auto}.composer-box{display:flex;align-items:flex-end;gap:5px;min-height:58px;padding:8px 8px 8px 9px;border:1px solid #333;border-radius:18px;background:#080808;transition:border-color var(--speed),background var(--speed)}.composer-box:focus-within{border-color:#666;background:#0a0a0a}.composer textarea{flex:1;min-width:0;min-height:40px;max-height:190px;resize:none;overflow:auto;border:0;outline:0;background:transparent;color:#fff;padding:9px 5px;line-height:1.45;font-size:14px}.composer textarea::placeholder{color:#777}.composer-btn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:12px;background:transparent;color:#aaa;transition:background var(--speed),color var(--speed)}.composer-btn:hover{background:#181818;color:#fff}.composer-btn svg{width:18px;height:18px}.send-btn{background:#fff;color:#000}.send-btn:hover{background:#fff;color:#000}.send-btn:disabled{opacity:.28;cursor:not-allowed}.composer-hint{text-align:center;padding-top:8px;color:#666;font-size:9.5px}.attachment{display:flex;align-items:center;gap:8px;margin:0 0 7px;padding:7px 9px;border:1px solid #222;border-radius:9px;background:#050505;color:#aaa;font-size:10px}.attachment button{margin-left:auto;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:transparent;color:#aaa}.attachment button:hover{background:#151515;color:#fff}
.panel{position:absolute;inset:58px 0 0;z-index:20;overflow:auto;background:#000;padding:38px 26px 120px}.panel-inner{width:min(900px,100%);margin:auto}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:25px}.panel-title{margin:0;color:#fff;font-size:25px;letter-spacing:-.03em}.panel-subtitle{margin:7px 0 0;color:#888;font-size:12px}.panel-close{width:36px;height:36px;display:grid;place-items:center;border:1px solid #252525;border-radius:9px;background:#050505}.panel-close:hover{background:#111}.panel-close svg{width:17px;height:17px}.settings-list{display:grid;gap:10px}.setting{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px;border:1px solid #202020;border-radius:12px;background:#050505}.setting-copy{min-width:0}.setting-title{display:block;color:#fff;font-size:13px;font-weight:650}.setting-desc{display:block;margin-top:4px;color:#888;font-size:11px;line-height:1.5}.switch{position:relative;width:42px;height:24px;flex:none}.switch input{position:absolute;opacity:0;pointer-events:none}.switch span{position:absolute;inset:0;border:1px solid #444;border-radius:999px;background:#111;transition:background var(--speed),border-color var(--speed)}.switch span:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#777;transition:transform var(--speed),background var(--speed)}.switch input:checked+span{background:#fff;border-color:#fff}.switch input:checked+span:after{transform:translateX(18px);background:#000}.danger-btn{height:38px;padding:0 13px;border:1px solid #333;border-radius:9px;background:#080808;color:#fff;font-size:11px}.danger-btn:hover{background:#161616}.about{margin-top:16px;padding:15px;border-top:1px solid #202020;color:#777;font-size:10px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:105px;z-index:100;transform:translate(-50%,12px);padding:9px 13px;border:1px solid #333;border-radius:9px;background:#fff;color:#000;font-size:11px;opacity:0;pointer-events:none;transition:opacity var(--speed),transform var(--speed)}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{display:none}
@keyframes blink{50%{opacity:.25}}
@media(max-width:1050px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){:root{--sidebar:270px}.messages{padding-left:20px;padding-right:20px}.message-body{max-width:87%}}
@media(max-width:760px){.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(300px,88vw);transform:translateX(-105%);box-shadow:18px 0 50px rgba(0,0,0,.8)}.sidebar.open{transform:translateX(0)}.sidebar.collapsed{width:min(300px,88vw);flex-basis:auto;transform:translateX(-105%)}.mobile-menu{display:grid}.desktop-toggle{display:none}.overlay{position:fixed;inset:0;display:block;background:rgba(0,0,0,.75);z-index:50}.overlay.hidden{display:none}.topbar{height:54px;flex-basis:54px;padding:0 9px}.topbar-title{max-width:57%;font-size:12px}.status{display:none}.messages{padding:24px 13px 155px}.welcome{min-height:calc(100dvh - 215px)}.welcome-inner{padding:18px 3px}.welcome-mark{width:54px;height:54px;border-radius:16px;font-size:19px;margin-bottom:18px}.welcome h1{font-size:25px}.welcome-subtitle{font-size:12px;margin-top:9px}.quick-grid{grid-template-columns:1fr;margin-top:23px}.quick-card{min-height:67px;padding:13px}.quick-icon{width:25px;height:25px;margin-bottom:9px}.quick-desc{font-size:10px}.message{gap:8px;margin:23px 0}.message-body{max-width:89%}.bubble{font-size:13.5px;line-height:1.7}.avatar{width:28px;height:28px;flex-basis:28px}.composer-wrap{padding:11px 9px max(10px,env(safe-area-inset-bottom))}.composer-box{min-height:54px;border-radius:16px;padding:7px}.composer textarea{font-size:13.5px}.composer-btn{width:38px;height:38px;flex-basis:38px}.composer-hint{font-size:9px}.panel{inset:54px 0 0;padding:24px 14px 100px}.panel-title{font-size:21px}.setting{padding:13px}.setting-title{font-size:12px}.setting-desc{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="sidebar" id="sidebar" aria-label="Chat navigation">
  <div class="sidebar-head">
    <div class="brand"><div class="brand-mark">B</div><span class="brand-name">Barberian</span></div>
    <button class="new-chat" id="newChat" type="button" aria-label="Start a new chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span></button>
  </div>
  <div class="history" id="history"><div class="history-label">Chats</div></div>
  <div class="sidebar-foot"><button class="nav-btn" id="settingsBtn" type="button" data-module="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.4 15 .1.1-1.7 2.9-2-.8a7.5 7.5 0 0 1-1.9 1.1l-.3 2.1h-3.3L10 18.3a7.5 7.5 0 0 1-1.9-1.1l-2 .8-1.7-2.9 1.7-1.3a7.4 7.4 0 0 1 0-2.2L4.4 10.3l1.7-2.9 2 .8A7.5 7.5 0 0 1 10 7.1l.3-2.1h3.3l.3 2.1a7.5 7.5 0 0 1 1.9 1.1l2-.8 1.7 2.9-1.7 1.3a7.4 7.4 0 0 1 0 2.2Z"/></svg><span>Settings</span></button></div>
</aside>
<div class="overlay hidden" id="overlay"></div>
<main class="main">
  <header class="topbar">
    <button class="icon-btn mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="icon-btn desktop-toggle" id="desktopToggle" type="button" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="topbar-title" id="title">New chat</div>
    <div class="topbar-spacer"></div>
    <div class="status" id="status"><span class="status-dot"></span><span>Connecting</span></div>
    <button class="icon-btn" id="clearCurrent" type="button" aria-label="Clear current chat" title="Clear current chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button>
  </header>
  <section class="chat" id="chat" aria-live="polite"><div class="messages" id="messages"></div></section>
  <section class="panel hidden" id="panel"></section>
  <div class="composer-wrap">
    <form class="composer" id="composer">
      <div class="attachment hidden" id="attachment"><span id="attachmentName"></span><button id="removeAttachment" type="button" aria-label="Remove attachment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
      <div class="composer-box">
        <button class="composer-btn" id="attach" type="button" aria-label="Attach file" title="Attach file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 11.2 12 19.7a5.5 5.5 0 0 1-7.8-7.8l8.3-8.3a3.8 3.8 0 0 1 5.4 5.4L9.6 17.3a2.2 2.2 0 0 1-3.1-3.1l7.7-7.7"/></svg></button>
        <input id="fileInput" type="file" hidden>
        <textarea id="input" rows="1" placeholder="Message Barberian…" aria-label="Message Barberian"></textarea>
        <button class="composer-btn send-btn" id="send" type="submit" aria-label="Send message" title="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="composer-hint">Enter to send · Shift + Enter for a new line</div>
    </form>
  </div>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const sidebar=$('#sidebar'),overlay=$('#overlay'),messages=$('#messages'),input=$('#input'),send=$('#send'),status=$('#status'),title=$('#title'),panel=$('#panel'),history=$('#history'),chat=$('#chat'),fileInput=$('#fileInput'),attachment=$('#attachment'),attachmentName=$('#attachmentName');
let conversations=[];try{conversations=JSON.parse(localStorage.getItem('barberian_chats')||'[]')}catch{conversations=[]}
let currentId=null,busy=false,controller=null,selectedFile=null;
const settings=(()=>{try{return JSON.parse(localStorage.getItem('barberian_settings')||'{}')}catch{return {}}})();
function save(){localStorage.setItem('barberian_chats',JSON.stringify(conversations.slice(-50)))}
function saveSettings(){localStorage.setItem('barberian_settings',JSON.stringify(settings))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMarkdown(text){let s=escapeHtml(text);const blocks=[];s=s.replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,x)=>{const i=blocks.length;blocks.push(x.replace(/^\n|\n$/g,''));return `@@CODE${i}@@`});s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');s=s.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');s=s.replace(/^[-*] (.+)$/gm,'<li>$1</li>');s=s.replace(/(<li>.*<\/li>)(?:<br>)?/g,'<ul>$1</ul>');s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');s=s.replace(/\n/g,'<br>');blocks.forEach((x,i)=>{s=s.replace(`@@CODE${i}@@`,`<pre><code>${x}</code></pre>`)});return s}
function toast(text){const n=$('#toast');n.textContent=text;n.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>n.classList.remove('show'),1700)}
function renderHistory(){history.querySelectorAll('.history-item,.empty-history').forEach(x=>x.remove());if(!conversations.length){const e=document.createElement('div');e.className='empty-history';e.textContent='No previous chats';history.append(e);return}conversations.slice().reverse().forEach(c=>{const b=document.createElement('button');b.type='button';b.className='history-item'+(c.id===currentId?' active':'');b.innerHTML='<span class="dot"></span><span class="label">'+escapeHtml(c.title||'New chat')+'</span>';b.onclick=()=>loadChat(c.id);history.append(b)})}
const icons={research:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>',plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h5"/></svg>',code:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>',automate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3v5a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3v7M6 3l-2 3 2 3M18 21l2-3-2-3"/></svg>'};
function welcome(){messages.innerHTML='<div class="welcome"><div class="welcome-inner"><div class="welcome-mark">B</div><h1>How can I help?</h1><p class="welcome-subtitle">Research, plan, code, create, automate, and execute with Barberian.</p><div class="quick-grid"><button class="quick-card" type="button" data-prompt="Research this topic and give me the key findings."><span class="quick-icon">'+icons.research+'</span><span class="quick-title">Research</span><span class="quick-desc">Find and synthesize the important information.</span></button><button class="quick-card" type="button" data-prompt="Plan this project step by step."><span class="quick-icon">'+icons.plan+'</span><span class="quick-title">Plan</span><span class="quick-desc">Turn an idea into a practical execution plan.</span></button><button class="quick-card" type="button" data-prompt="Review this code and find potential problems."><span class="quick-icon">'+icons.code+'</span><span class="quick-title">Code</span><span class="quick-desc">Review, debug, improve, and explain code.</span></button><button class="quick-card" type="button" data-prompt="Create a reliable automation workflow for this task."><span class="quick-icon">'+icons.automate+'</span><span class="quick-title">Automate</span><span class="quick-desc">Design a workflow that can run repeatedly.</span></button></div></div></div>';document.querySelectorAll('.quick-card').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;resize();updateSend();input.focus()})}
function messageNode(role,text,meta=''){const row=document.createElement('div');row.className='message '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'YOU':'B';const body=document.createElement('div');body.className='message-body';const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML=role==='assistant'?renderMarkdown(text):escapeHtml(text).replace(/\n/g,'<br>');body.append(bubble);if(meta){const m=document.createElement('div');m.className='meta';m.innerHTML='<span>'+escapeHtml(meta)+'</span>';if(role==='assistant')m.append(copyButton(text));body.append(m)}row.append(av,body);messages.append(row);return bubble}
function copyButton(text){const c=document.createElement('button');c.type='button';c.className='copy-btn';c.textContent='Copy';c.onclick=()=>copyMessage(text);return c}
function copyMessage(text){navigator.clipboard?.writeText(text).then(()=>toast('Copied')).catch(()=>toast('Copy unavailable'))}
function current(){return conversations.find(c=>c.id===currentId)}
function loadChat(id){const c=conversations.find(x=>x.id===id);if(!c)return;currentId=id;title.textContent=c.title||'New chat';panel.classList.add('hidden');messages.innerHTML='';c.messages.forEach(m=>messageNode(m.role,m.text,m.meta));renderHistory();closeMobile();requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}
function newChat(){if(busy)return;currentId=null;title.textContent='New chat';panel.classList.add('hidden');welcome();renderHistory();closeMobile();input.focus()}
function ensureChat(firstText){if(currentId&&current())return current();const c={id:uid(),title:firstText.slice(0,48),messages:[]};conversations.push(c);currentId=c.id;title.textContent=c.title;return c}
function addStored(c,role,text,meta=''){c.messages.push({role,text,meta});save();renderHistory()}
async function sendMessage(text){if(busy||!text.trim())return;const clean=text.trim(),c=ensureChat(clean);if(messages.querySelector('.welcome'))messages.innerHTML='';addStored(c,'user',clean);messageNode('user',clean);const bubble=messageNode('assistant','');bubble.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';busy=true;controller=new AbortController();send.disabled=true;input.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean}),signal:controller.signal});const j=await r.json();if(!r.ok)throw new Error(j.error||j.message||'Request failed');const answer=j.data??j.message??JSON.stringify(j,null,2);bubble.innerHTML=renderMarkdown(answer);const meta=[j.provider,j.model,j.latency_ms!=null?j.latency_ms+'ms':null].filter(Boolean).join(' · ');if(meta){const row=bubble.parentElement,m=document.createElement('div');m.className='meta';m.innerHTML='<span>'+escapeHtml(meta)+'</span>';m.append(copyButton(answer));row.append(m)}addStored(c,'assistant',answer,meta);if(j.run_id)events(j.run_id)}catch(e){if(e.name==='AbortError'){bubble.innerHTML='<strong>Generation stopped.</strong>';addStored(c,'assistant','Generation stopped.')}else{const msg='Request failed: '+e.message;bubble.innerHTML='<strong>Request failed.</strong><br>'+escapeHtml(e.message);addStored(c,'assistant',msg)}}finally{busy=false;controller=null;input.disabled=false;updateSend();input.focus();requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,190)+'px'}
function updateSend(){send.disabled=busy||!input.value.trim()}
function closeMobile(){sidebar.classList.remove('open');overlay.classList.add('hidden')}
function openPanel(name){panel.classList.remove('hidden');if(name!=='Settings')name='Settings';panel.innerHTML='<div class="panel-inner"><div class="panel-head"><div><h2 class="panel-title">Settings</h2><p class="panel-subtitle">Control the Barberian web workspace.</p></div><button class="panel-close" id="panelClose" type="button" aria-label="Close settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div><div class="settings-list"><div class="setting"><div class="setting-copy"><span class="setting-title">Enter to send</span><span class="setting-desc">Press Enter to send. Disable for a keyboard-first multiline composer.</span></div><label class="switch"><input id="enterSend" type="checkbox" '+(settings.enterSend!==false?'checked':'')+'><span></span></label></div><div class="setting"><div class="setting-copy"><span class="setting-title">Auto focus</span><span class="setting-desc">Focus the message box after opening or finishing a response.</span></div><label class="switch"><input id="autoFocus" type="checkbox" '+(settings.autoFocus!==false?'checked':'')+'><span></span></label></div><div class="setting"><div class="setting-copy"><span class="setting-title">Local chat history</span><span class="setting-desc">Chats are stored in this browser using localStorage.</span></div><button class="danger-btn" id="clearHistory" type="button">Clear history</button></div></div><div class="about">Barberian UI · AMOLED black workspace · Mobile + desktop responsive shell</div></div>';$('#panelClose').onclick=()=>panel.classList.add('hidden');$('#enterSend').onchange=e=>{settings.enterSend=e.target.checked;saveSettings()};$('#autoFocus').onchange=e=>{settings.autoFocus=e.target.checked;saveSettings()};$('#clearHistory').onclick=()=>{if(confirm('Clear all local Barberian chat history?')){conversations=[];currentId=null;save();renderHistory();welcome();title.textContent='New chat';toast('History cleared');panel.classList.add('hidden')}};closeMobile()}
function clearCurrent(){if(busy)return;if(currentId){const i=conversations.findIndex(c=>c.id===currentId);if(i>=0)conversations.splice(i,1);save();currentId=null;title.textContent='New chat';renderHistory();welcome();toast('Chat cleared')}else{welcome();toast('New chat ready')}}
async function health(){try{const r=await fetch('/api/health',{cache:'no-store'});if(!r.ok)throw new Error();status.classList.add('online');status.innerHTML='<span class="status-dot"></span><span>Online</span>'}catch{status.classList.remove('online');status.innerHTML='<span class="status-dot"></span><span>Offline</span>'}}
async function events(runId){try{await fetch('/api/events?run_id='+encodeURIComponent(runId),{cache:'no-store'})}catch{}}
$('#newChat').onclick=newChat;$('#mobileMenu').onclick=()=>{sidebar.classList.add('open');overlay.classList.remove('hidden')};overlay.onclick=closeMobile;$('#desktopToggle').onclick=()=>sidebar.classList.toggle('collapsed');$('#settingsBtn').onclick=()=>openPanel('Settings');$('#clearCurrent').onclick=()=>{if(busy){controller?.abort();return}clearCurrent()};$('#attach').onclick=()=>fileInput.click();$('#removeAttachment').onclick=()=>{selectedFile=null;fileInput.value='';attachment.classList.add('hidden')};fileInput.onchange=()=>{const f=fileInput.files?.[0];if(!f)return;selectedFile=f;attachmentName.textContent=f.name;attachment.classList.remove('hidden');toast('File attached locally')};$('#composer').onsubmit=e=>{e.preventDefault();if(busy){controller?.abort();return}const text=input.value;input.value='';resize();updateSend();sendMessage(text)};input.addEventListener('input',()=>{resize();updateSend()});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&(settings.enterSend!==false)){e.preventDefault();$('#composer').requestSubmit()}});welcome();renderHistory();health();setInterval(health,30000);if(settings.autoFocus!==false)input.focus();
</script>
</body>
</html>

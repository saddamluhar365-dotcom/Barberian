<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>Barberian</title>
<style>
:root{--bg:#212121;--panel:#171717;--panel2:#2a2a2a;--border:#3a3a3a;--text:#ececec;--muted:#9b9b9b;--soft:#303030;--accent:#fff;--danger:#ef4444;--shadow:0 8px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}body{overflow:hidden}.app{display:flex;width:100%;height:100dvh;position:relative}
.sidebar{width:260px;flex:0 0 260px;background:#171717;border-right:1px solid #292929;display:flex;flex-direction:column;z-index:20;transition:transform .2s ease}.sidebar-head{padding:12px;display:flex;gap:8px;align-items:center}.new-chat{width:100%;border:1px solid #383838;background:#212121;color:var(--text);border-radius:10px;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:9px}.new-chat:hover,.nav-btn:hover,.icon-btn:hover{background:#2a2a2a}.history{flex:1;overflow:auto;padding:4px 8px}.history-label{padding:12px 10px 7px;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.history-item{display:flex;align-items:center;width:100%;gap:8px;border:0;background:transparent;color:#bbb;padding:9px 10px;border-radius:8px;text-align:left;white-space:nowrap;overflow:hidden}.history-item.active,.history-item:hover{background:#292929;color:#fff}.history-item span{overflow:hidden;text-overflow:ellipsis}.sidebar-foot{padding:8px;border-top:1px solid #292929}.nav-btn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#bbb;padding:10px;border-radius:8px;text-align:left}.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100%}.topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #292929;background:rgba(33,33,33,.92);backdrop-filter:blur(10px);position:relative;z-index:5}.top-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-sub{color:#777;font-size:12px;margin-left:auto}.icon-btn{width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:#ddd;display:grid;place-items:center}.mobile-only{display:none}.chat{flex:1;overflow:auto;scroll-behavior:smooth}.messages{width:min(900px,100%);margin:0 auto;padding:28px 22px 150px}.welcome{min-height:calc(100dvh - 220px);display:grid;place-items:center;text-align:center}.welcome-inner{max-width:650px}.logo{width:56px;height:56px;border-radius:16px;background:#fff;color:#111;display:grid;place-items:center;margin:0 auto 18px;font-size:25px;font-weight:800}.welcome h1{font-size:28px;margin:0 0 8px}.welcome p{margin:0;color:#999;line-height:1.6}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:24px}.suggestion{border:1px solid #3b3b3b;background:#252525;color:#ddd;border-radius:12px;padding:13px;text-align:left}.suggestion:hover{background:#2d2d2d}.message{display:flex;gap:12px;margin:26px 0;animation:appear .15s ease}.message.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:#303030;color:#ddd;display:grid;place-items:center;font-size:12px;font-weight:700}.message.user .avatar{order:2;background:#444}.message-body{max-width:min(78%,760px);min-width:0}.bubble{line-height:1.65;font-size:15px;overflow-wrap:anywhere}.message.user .bubble{background:#303030;border-radius:18px;padding:10px 14px}.assistant .bubble{padding-top:2px}.meta{color:#777;font-size:11px;margin-top:7px;display:flex;align-items:center;gap:8px}.copy-btn{border:0;background:transparent;color:#777;padding:2px 0}.copy-btn:hover{color:#ddd}.composer-wrap{position:fixed;left:260px;right:0;bottom:0;padding:18px 20px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:10}.composer{width:min(900px,100%);margin:auto;background:#2b2b2b;border:1px solid #4a4a4a;border-radius:18px;box-shadow:var(--shadow);padding:8px}.composer-row{display:flex;align-items:flex-end;gap:7px}.attach,.send{width:40px;height:40px;border:0;border-radius:11px;display:grid;place-items:center}.attach{background:transparent;color:#aaa}.attach:hover{background:#3a3a3a;color:#fff}.send{background:#fff;color:#111}.send:disabled{opacity:.35;cursor:not-allowed}.composer textarea{flex:1;min-width:0;max-height:180px;min-height:40px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:10px 6px;line-height:1.4}.hint{text-align:center;color:#777;font-size:11px;padding:7px 2px 1px}.typing{display:inline-flex;gap:4px;align-items:center}.typing i{width:5px;height:5px;border-radius:50%;background:#aaa;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}.panel{position:absolute;inset:58px 0 0;background:var(--bg);overflow:auto;padding:28px;z-index:4}.panel.hidden{display:none}.panel-inner{width:min(1000px,100%);margin:auto}.panel h2{margin-top:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #333;background:#191919;border-radius:12px;padding:15px}.card strong{display:block;margin-bottom:6px}.muted{color:#888}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%) translateY(12px);background:#f5f5f5;color:#111;padding:9px 13px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}pre{background:#111;border:1px solid #333;border-radius:10px;padding:13px;overflow:auto}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}blockquote{border-left:3px solid #666;margin:12px 0;padding-left:14px;color:#bbb}a{color:#ddd}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.3}}
@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;width:min(290px,88vw);transform:translateX(-105%);box-shadow:var(--shadow)}.sidebar.open{transform:none}.mobile-only{display:grid}.composer-wrap{left:0;padding-left:10px;padding-right:10px}.messages{padding-left:14px;padding-right:14px}.message-body{max-width:86%}.topbar{padding:0 10px}.top-sub{display:none}.suggestions{grid-template-columns:1fr}.welcome h1{font-size:24px}.panel{inset:58px 0 0;padding:20px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15}.overlay.hidden{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head"><button class="new-chat" id="newChat"><span>＋</span><span>New chat</span></button></div>
    <div class="history" id="history"><div class="history-label">Chats</div></div>
    <div class="sidebar-foot"><button class="nav-btn" data-module="Settings"><span>⚙</span><span>Settings</span></button></div>
  </aside>
  <div class="overlay hidden" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="mobileMenu" aria-label="Open menu">☰</button>
      <button class="icon-btn" id="desktopToggle" aria-label="Toggle sidebar">☰</button>
      <div class="top-title" id="title">New chat</div>
      <div class="top-sub" id="status">Connecting…</div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button>
    </header>
    <section class="chat" id="chat"><div class="messages" id="messages"></div></section>
    <section class="panel hidden" id="panel"></section>
    <div class="composer-wrap"><form class="composer" id="composer"><div class="composer-row"><button type="button" class="attach" id="attach" aria-label="Attach file">＋</button><textarea id="input" rows="1" placeholder="Message Barberian…" aria-label="Message Barberian"></textarea><button type="submit" class="send" id="send" aria-label="Send" disabled>↑</button></div><div class="hint">Barberian can research, plan, code, create, automate, and execute.</div></form></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const sidebar=$('#sidebar'),overlay=$('#overlay'),messages=$('#messages'),input=$('#input'),send=$('#send'),status=$('#status'),title=$('#title'),panel=$('#panel'),history=$('#history'),chat=$('#chat'),themeToggle=$('#themeToggle');
const modules=['Projects','Files','Tasks','MCP','Skills','APIs','Models','Tools','Research','Media','Code','GitHub','Sandbox','Logs','Usage','Security','Settings'];
let conversations=JSON.parse(localStorage.getItem('barberian_chats')||'[]');let currentId=null;let busy=false;
function save(){localStorage.setItem('barberian_chats',JSON.stringify(conversations.slice(-50)))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMarkdown(text){let s=escapeHtml(text);s=s.replace(/```([\s\S]*?)```/g,(_,x)=>'<pre><code>'+x.trim()+'</code></pre>');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>');s=s.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');s=s.replace(/\n/g,'<br>');return s}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
function renderHistory(){history.querySelectorAll('.history-item').forEach(x=>x.remove());if(!conversations.length){const e=document.createElement('div');e.className='muted';e.style.padding='12px 10px';e.textContent='No previous chats';history.append(e);return}conversations.slice().reverse().forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===currentId?' active':'');b.innerHTML='<span>◦</span><span>'+escapeHtml(c.title||'New chat')+'</span>';b.onclick=()=>loadChat(c.id);history.append(b)})}
function welcome(){messages.innerHTML='<div class="welcome"><div class="welcome-inner"><div class="logo">B</div><h1>How can I help?</h1><p>Ask Barberian to research, plan, code, create, automate, or execute.</p><div class="suggestions"><button class="suggestion" data-prompt="Research this topic and give me the key findings.">Research a topic</button><button class="suggestion" data-prompt="Plan this project step by step.">Plan a project</button><button class="suggestion" data-prompt="Review this code and find potential problems.">Review code</button><button class="suggestion" data-prompt="Create a practical automation workflow for this task.">Create automation</button></div></div></div>';document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;resize();input.focus();updateSend()})}
function messageNode(role,text,meta=''){const row=document.createElement('div');row.className='message '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'You':'B';const body=document.createElement('div');body.className='message-body';const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML=role==='assistant'?renderMarkdown(text):escapeHtml(text).replace(/\n/g,'<br>');body.append(bubble);if(meta){const m=document.createElement('div');m.className='meta';m.innerHTML='<span>'+escapeHtml(meta)+'</span>';if(role==='assistant'){const c=document.createElement('button');c.className='copy-btn';c.textContent='Copy';c.onclick=()=>copyMessage(text);m.append(c)}body.append(m)}row.append(av,body);messages.append(row);return bubble}
function copyMessage(text){navigator.clipboard?.writeText(text).then(()=>toast('Copied')).catch(()=>toast('Copy unavailable'))}
function current(){return conversations.find(c=>c.id===currentId)}
function loadChat(id){const c=conversations.find(x=>x.id===id);if(!c)return;currentId=id;title.textContent=c.title||'New chat';panel.classList.add('hidden');messages.innerHTML='';c.messages.forEach(m=>messageNode(m.role,m.text,m.meta));renderHistory();closeMobile();setTimeout(()=>chat.scrollTop=chat.scrollHeight,0)}
function newChat(){currentId=null;title.textContent='New chat';panel.classList.add('hidden');welcome();renderHistory();closeMobile()}
function ensureChat(firstText){if(currentId)return current();const c={id:uid(),title:firstText.slice(0,48),messages:[]};conversations.push(c);currentId=c.id;return c}
function addStored(c,role,text,meta=''){c.messages.push({role,text,meta});save();renderHistory()}
function addWorking(){return messageNode('assistant','<span class="typing"><i></i><i></i><i></i></span>')}
async function sendMessage(text){if(busy||!text.trim())return;const c=ensureChat(text.trim());if(messages.querySelector('.welcome'))messages.innerHTML='';addStored(c,'user',text);messageNode('user',text);const bubble=messageNode('assistant','');bubble.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';busy=true;send.disabled=true;input.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const j=await r.json();if(!r.ok)throw new Error(j.error||j.message||'Request failed');const answer=j.data??j.message??JSON.stringify(j,null,2);bubble.innerHTML=renderMarkdown(answer);const meta=[j.provider,j.model,j.latency_ms!=null?j.latency_ms+'ms':null].filter(Boolean).join(' · ');if(meta){const row=bubble.parentElement;const m=document.createElement('div');m.className='meta';m.innerHTML='<span>'+escapeHtml(meta)+'</span>';const cpy=document.createElement('button');cpy.className='copy-btn';cpy.textContent='Copy';cpy.onclick=()=>copyMessage(answer);m.append(cpy);row.append(m)}addStored(c,'assistant',answer,meta);if(j.run_id){const stream=new EventSource('/api/events?run_id='+encodeURIComponent(j.run_id));stream.onmessage=ev=>{try{if(JSON.parse(ev.data).event_type==='completed')stream.close()}catch{}}}}catch(e){const msg='Request failed: '+e.message;bubble.textContent=msg;addStored(c,'assistant',msg)}finally{busy=false;input.disabled=false;updateSend();input.focus();chat.scrollTop=chat.scrollHeight}}
async function health(){try{const r=await fetch('/api/health',{cache:'no-store'});const j=await r.json();status.textContent=j.status==='healthy'?'Online':'Available'}catch{status.textContent='Offline'}}
async function openModule(name){title.textContent=name;if(name==='New chat'){newChat();return}panel.classList.remove('hidden');panel.innerHTML='<div class="panel-inner"><h2>'+escapeHtml(name)+'</h2><p class="muted">Loading…</p></div>';try{let data={ok:true,items:[]};if(name==='APIs')data=await getJson('/api/providers');else if(name==='Models')data=await getJson('/api/models');else if(name==='MCP')data=await getJson('/api/mcp');else if(name==='Skills')data=await getJson('/api/skills');else if(['Tools','Settings','Security'].includes(name))data=await getJson('/api/status');else if(name==='Research')data=await getJson('/api/capabilities');else if(name==='Tasks')data=await getJson('/api/tasks');renderPanel(name,data)}catch(e){panel.innerHTML='<div class="panel-inner"><h2>'+escapeHtml(name)+'</h2><p class="muted">Unable to load module.</p></div>'}}
async function getJson(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function renderPanel(name,data){const items=data.items||[];panel.innerHTML='<div class="panel-inner"><h2>'+escapeHtml(name)+'</h2><div class="cards">'+(items.length?items.map(x=>{const label=typeof x==='string'?x:(x.name||x.provider||x.model||'Item');const detail=typeof x==='string'?'Registered':JSON.stringify(x);return '<div class="card"><strong>'+escapeHtml(label)+'</strong><div class="muted">'+escapeHtml(detail)+'</div></div>'}).join(''):'<div class="card muted">No registered items.</div>')+'</div></div>'}
function updateSend(){send.disabled=busy||!input.value.trim()||input.disabled}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'}
function closeMobile(){sidebar.classList.remove('open');overlay.classList.add('hidden')}
$('#newChat').onclick=newChat;$('#desktopToggle').onclick=()=>sidebar.classList.toggle('collapsed');$('#mobileMenu').onclick=()=>{sidebar.classList.add('open');overlay.classList.remove('hidden')};overlay.onclick=closeMobile;
input.addEventListener('input',()=>{resize();updateSend()});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});
$('#composer').onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';resize();updateSend();sendMessage(text)};
$('#attach').onclick=()=>toast('File upload is not enabled by the current API');
themeToggle.onclick=()=>{document.body.classList.toggle('light');const light=document.body.classList.contains('light');document.documentElement.style.setProperty('--bg',light?'#fff':'#212121');document.documentElement.style.setProperty('--panel',light?'#f7f7f7':'#171717');document.documentElement.style.setProperty('--panel2',light?'#f0f0f0':'#2a2a2a');document.documentElement.style.setProperty('--text',light?'#171717':'#ececec');document.documentElement.style.setProperty('--muted',light?'#666':'#9b9b9b');themeToggle.textContent=light?'☀':'◐';localStorage.setItem('barberian_theme',light?'light':'dark')};
document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>openModule(b.dataset.module));
if(localStorage.getItem('barberian_theme')==='light')themeToggle.click();
newChat();health();setInterval(health,30000);
</script>
</body>
</html>

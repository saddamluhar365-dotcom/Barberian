<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Barberian universal AI agent">
<title>Barberian</title>
<style>
:root{--black:#000;--surface:#0a0a0a;--surface-2:#111;--surface-3:#171717;--line:#262626;--line-soft:#1a1a1a;--text:#f5f5f5;--muted:#a3a3a3;--dim:#737373;--accent:#fff;--user:#1d1d1d;--danger:#ef4444;--sidebar:276px;--content:860px;--radius:14px;--ease:180ms cubic-bezier(.2,.7,.2,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--black);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}body{overflow:hidden}button,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #777;outline-offset:2px}.app{width:100%;height:100dvh;display:flex;background:#000}.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);height:100%;display:flex;flex-direction:column;background:#050505;border-right:1px solid var(--line-soft);transition:transform var(--ease),width var(--ease),flex-basis var(--ease);z-index:50}.sidebar.collapsed{width:0;flex-basis:0;overflow:hidden;border:0}.sidebar-head{padding:14px 12px 10px}.brand{height:40px;display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:10px}.brand-mark{width:29px;height:29px;display:grid;place-items:center;border:1px solid #3b3b3b;border-radius:9px;background:#0d0d0d;font-size:12px;font-weight:800;letter-spacing:-.03em}.brand-name{font-size:15px;font-weight:700;letter-spacing:-.01em}.new-chat{width:100%;height:43px;display:flex;align-items:center;gap:10px;padding:0 13px;background:#111;border:1px solid #292929;border-radius:11px;color:#f0f0f0;font-size:13px;font-weight:600;transition:background var(--ease),border-color var(--ease)}.new-chat:hover{background:#191919;border-color:#3a3a3a}.new-chat .plus{font-size:20px;font-weight:400}.history{flex:1;min-height:0;overflow:auto;padding:8px 9px;scrollbar-width:thin;scrollbar-color:#292929 transparent}.history-label{padding:12px 9px 7px;color:#666;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.history-item{width:100%;height:39px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:9px;background:transparent;color:#bdbdbd;text-align:left;font-size:12.5px;transition:background var(--ease),color var(--ease)}.history-item:hover{background:#111;color:#eee}.history-item.active{background:#171717;color:#fff}.history-item .dot{width:5px;height:5px;border-radius:50%;background:#555;flex:none}.history-item.active .dot{background:#ddd}.history-item .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty-history{padding:12px 9px;color:#555;font-size:12px}.sidebar-foot{padding:9px;border-top:1px solid var(--line-soft)}.nav-btn{width:100%;height:40px;display:flex;align-items:center;gap:10px;padding:0 11px;border-radius:9px;background:transparent;color:#a8a8a8;text-align:left;font-size:12.5px;transition:background var(--ease),color var(--ease)}.nav-btn:hover{background:#111;color:#eee}.nav-icon{width:18px;text-align:center;color:#777}.main{position:relative;min-width:0;flex:1;height:100%;display:flex;flex-direction:column;background:#000}.topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line-soft);background:rgba(0,0,0,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:20}.topbar-title{min-width:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;color:#e5e5e5}.topbar-spacer{flex:1}.status{display:flex;align-items:center;gap:6px;color:#666;font-size:10px}.status-dot{width:6px;height:6px;border-radius:50%;background:#666}.status.online{color:#8a8a8a}.status.online .status-dot{background:#a3a3a3}.icon-btn{width:36px;height:36px;display:grid;place-items:center;background:transparent;border-radius:9px;color:#8c8c8c;font-size:18px;transition:background var(--ease),color var(--ease)}.icon-btn:hover{background:#151515;color:#fff}.mobile-menu{display:none}.chat{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#292929 transparent}.messages{width:min(var(--content),100%);margin:0 auto;padding:34px 24px 190px}.welcome{min-height:calc(100dvh - 280px);display:flex;align-items:center;justify-content:center;text-align:center}.welcome-inner{width:min(680px,100%);padding:30px 0}.welcome-mark{width:62px;height:62px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid #333;border-radius:18px;background:#080808;box-shadow:0 0 0 1px #0d0d0d;font-size:22px;font-weight:800}.welcome h1{margin:0;color:#f5f5f5;font-size:30px;line-height:1.15;letter-spacing:-.035em}.welcome-subtitle{margin:11px auto 0;max-width:540px;color:#7f7f7f;font-size:13px;line-height:1.65}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:28px;text-align:left}.quick-card{min-height:72px;padding:13px 14px;background:#080808;border:1px solid #202020;border-radius:12px;color:#ddd;transition:background var(--ease),border-color var(--ease),transform var(--ease)}.quick-card:hover{background:#101010;border-color:#343434;transform:translateY(-1px)}.quick-title{display:block;font-size:12.5px;font-weight:650;margin-bottom:5px}.quick-desc{display:block;color:#696969;font-size:11px;line-height:1.45}.message{display:flex;gap:12px;margin:28px 0;animation:messageIn .16s ease}.message.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:9px;border:1px solid #2d2d2d;background:#0b0b0b;color:#a8a8a8;font-size:9px;font-weight:800}.message.user .avatar{order:2;background:#1b1b1b;color:#ddd}.message-body{min-width:0;max-width:82%}.bubble{font-size:14px;line-height:1.75;color:#e3e3e3;overflow-wrap:anywhere}.message.user .bubble{padding:10px 14px;background:var(--user);border-radius:17px;color:#f2f2f2}.assistant .bubble{padding-top:1px}.bubble h2,.bubble h3{margin:16px 0 7px;line-height:1.3}.bubble h2{font-size:18px}.bubble h3{font-size:15px}.bubble strong{color:#fff}.bubble code{padding:2px 5px;border-radius:5px;background:#151515;color:#ddd;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.bubble pre{position:relative;margin:12px 0;padding:15px;overflow:auto;border:1px solid #292929;border-radius:11px;background:#080808}.bubble pre code{padding:0;background:transparent;color:#ddd;font-size:12px;line-height:1.6}.bubble blockquote{margin:12px 0;padding:2px 0 2px 13px;border-left:2px solid #444;color:#aaa}.meta{display:flex;align-items:center;gap:9px;margin-top:7px;color:#555;font-size:10px}.copy-btn{padding:0;background:transparent;color:#666;font-size:10px}.copy-btn:hover{color:#ddd}.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:20px 20px max(16px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(0,0,0,0),#000 27%,#000 100%);z-index:15}.composer{width:min(var(--content),100%);margin:0 auto}.composer-box{display:flex;align-items:flex-end;gap:5px;min-height:58px;padding:8px 8px 8px 9px;background:#101010;border:1px solid #303030;border-radius:18px;box-shadow:0 14px 45px rgba(0,0,0,.5);transition:border-color var(--ease),background var(--ease)}.composer-box:focus-within{background:#121212;border-color:#454545}.composer textarea{flex:1;min-width:0;min-height:40px;max-height:190px;resize:none;overflow:auto;border:0;outline:0;background:transparent;color:#f5f5f5;padding:9px 5px;line-height:1.45;font-size:14px}.composer textarea::placeholder{color:#686868}.composer-btn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:12px;background:transparent;color:#8b8b8b;font-size:19px;transition:background var(--ease),color var(--ease)}.composer-btn:hover{background:#242424;color:#fff}.send-btn{background:#f5f5f5;color:#050505;font-size:20px}.send-btn:hover{background:#fff;color:#000}.send-btn:disabled{opacity:.28;cursor:not-allowed}.composer-hint{text-align:center;padding-top:8px;color:#505050;font-size:9.5px}.typing{display:inline-flex;align-items:center;gap:4px;height:20px}.typing i{width:5px;height:5px;border-radius:50%;background:#8a8a8a;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}.panel{position:absolute;inset:58px 0 0;z-index:12;overflow:auto;background:#000;padding:36px 24px 120px}.panel-inner{width:min(900px,100%);margin:auto}.panel-title{margin:0 0 6px;font-size:24px;letter-spacing:-.025em}.panel-subtitle{margin:0 0 24px;color:#777;font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{padding:17px;background:#090909;border:1px solid #202020;border-radius:13px}.card-title{display:block;margin-bottom:6px;font-size:13px;font-weight:650}.card-text{color:#707070;font-size:11px;line-height:1.5}.toast{position:fixed;left:50%;bottom:108px;z-index:100;transform:translate(-50%,12px);padding:9px 13px;border-radius:9px;background:#f5f5f5;color:#000;font-size:11px;opacity:0;pointer-events:none;transition:opacity var(--ease),transform var(--ease)}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{display:none}@keyframes messageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.25}}@media(max-width:900px){:root{--sidebar:270px}.messages{padding-left:18px;padding-right:18px}.message-body{max-width:86%}}@media(max-width:760px){.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(300px,88vw);transform:translateX(-105%);box-shadow:18px 0 50px rgba(0,0,0,.7)}.sidebar.open{transform:translateX(0)}.sidebar.collapsed{width:min(300px,88vw);flex-basis:auto;transform:translateX(-105%)}.mobile-menu{display:grid}.desktop-toggle{display:none}.overlay{position:fixed;inset:0;display:block;background:rgba(0,0,0,.68);z-index:40}.overlay.hidden{display:none}.topbar{height:54px;flex-basis:54px;padding:0 9px}.topbar-title{max-width:55%;font-size:12px}.status{display:none}.messages{padding:24px 13px 158px}.welcome{min-height:calc(100dvh - 220px)}.welcome-inner{padding:20px 4px}.welcome-mark{width:54px;height:54px;border-radius:16px;font-size:19px;margin-bottom:18px}.welcome h1{font-size:25px}.welcome-subtitle{font-size:12px;margin-top:9px}.quick-grid{grid-template-columns:1fr;margin-top:23px}.quick-card{min-height:62px}.message{gap:9px;margin:24px 0}.message-body{max-width:88%}.bubble{font-size:13.5px;line-height:1.7}.avatar{width:28px;height:28px;flex-basis:28px}.composer-wrap{padding:12px 9px max(10px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(0,0,0,0),#000 24%,#000)}.composer-box{min-height:54px;border-radius:16px;padding:7px}.composer textarea{font-size:13.5px}.composer-btn{width:38px;height:38px;flex-basis:38px}.composer-hint{font-size:9px}.panel{inset:54px 0 0;padding:24px 14px 100px}.panel-title{font-size:21px}.cards{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="sidebar" id="sidebar" aria-label="Chat navigation">
  <div class="sidebar-head">
    <div class="brand"><div class="brand-mark">B</div><span class="brand-name">Barberian</span></div>
    <button class="new-chat" id="newChat" type="button"><span class="plus">＋</span><span>New chat</span></button>
  </div>
  <div class="history" id="history"><div class="history-label">Chats</div></div>
  <div class="sidebar-foot"><button class="nav-btn" data-module="Settings" type="button"><span class="nav-icon">⚙</span><span>Settings</span></button></div>
</aside>
<div class="overlay hidden" id="overlay"></div>
<main class="main">
  <header class="topbar">
    <button class="icon-btn mobile-menu" id="mobileMenu" type="button" aria-label="Open menu">☰</button>
    <button class="icon-btn desktop-toggle" id="desktopToggle" type="button" aria-label="Toggle sidebar">☰</button>
    <div class="topbar-title" id="title">New chat</div>
    <div class="topbar-spacer"></div>
    <div class="status" id="status"><span class="status-dot"></span><span>Connecting</span></div>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Dark mode">◐</button>
  </header>
  <section class="chat" id="chat" aria-live="polite"><div class="messages" id="messages"></div></section>
  <section class="panel hidden" id="panel"></section>
  <div class="composer-wrap">
    <form class="composer" id="composer">
      <div class="composer-box">
        <button class="composer-btn" id="attach" type="button" aria-label="Attach file">＋</button>
        <textarea id="input" rows="1" placeholder="Message Barberian…" aria-label="Message Barberian"></textarea>
        <button class="composer-btn send-btn" id="send" type="submit" aria-label="Send" disabled>↑</button>
      </div>
      <div class="composer-hint">Barberian can research, plan, code, create, automate, and execute.</div>
    </form>
  </div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const sidebar=$('#sidebar'),overlay=$('#overlay'),messages=$('#messages'),input=$('#input'),send=$('#send'),status=$('#status'),title=$('#title'),panel=$('#panel'),history=$('#history'),chat=$('#chat');
let conversations=[];try{conversations=JSON.parse(localStorage.getItem('barberian_chats')||'[]')}catch{conversations=[]}let currentId=null,busy=false;
function save(){localStorage.setItem('barberian_chats',JSON.stringify(conversations.slice(-50)))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMarkdown(text){let s=escapeHtml(text);s=s.replace(/```([\s\S]*?)```/g,(_,x)=>'<pre><code>'+x.trim()+'</code></pre>');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>');s=s.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');return s.replace(/\n/g,'<br>')}
function toast(text){const node=$('#toast');node.textContent=text;node.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>node.classList.remove('show'),1500)}
function renderHistory(){history.querySelectorAll('.history-item,.empty-history').forEach(x=>x.remove());if(!conversations.length){const e=document.createElement('div');e.className='empty-history';e.textContent='No previous chats';history.append(e);return}conversations.slice().reverse().forEach(c=>{const b=document.createElement('button');b.type='button';b.className='history-item'+(c.id===currentId?' active':'');b.innerHTML='<span class="dot"></span><span class="label">'+escapeHtml(c.title||'New chat')+'</span>';b.onclick=()=>loadChat(c.id);history.append(b)})}
function welcome(){messages.innerHTML='<div class="welcome"><div class="welcome-inner"><div class="welcome-mark">B</div><h1>How can I help?</h1><p class="welcome-subtitle">Research, plan, code, create, automate, or execute with Barberian.</p><div class="quick-grid"><button class="quick-card" type="button" data-prompt="Research this topic and give me the key findings."><span class="quick-title">Research</span><span class="quick-desc">Find and synthesize the important information.</span></button><button class="quick-card" type="button" data-prompt="Plan this project step by step."><span class="quick-title">Plan</span><span class="quick-desc">Turn an idea into a practical execution plan.</span></button><button class="quick-card" type="button" data-prompt="Review this code and find potential problems."><span class="quick-title">Code</span><span class="quick-desc">Review, debug, improve, and explain code.</span></button><button class="quick-card" type="button" data-prompt="Create a reliable automation workflow for this task."><span class="quick-title">Automate</span><span class="quick-desc">Design a workflow that can run repeatedly.</span></button></div></div></div>';document.querySelectorAll('.quick-card').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;resize();updateSend();input.focus()})}
function messageNode(role,text,meta=''){const row=document.createElement('div');row.className='message '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'YOU':'B';const body=document.createElement('div');body.className='message-body';const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML=role==='assistant'?renderMarkdown(text):escapeHtml(text).replace(/\n/g,'<br>');body.append(bubble);if(meta){const m=document.createElement('div');m.className='meta';m.innerHTML='<span>'+escapeHtml(meta)+'</span>';if(role==='assistant'){const c=document.createElement('button');c.type='button';c.className='copy-btn';c.textContent='Copy';c.onclick=()=>copyMessage(text);m.append(c)}body.append(m)}row.append(av,body);messages.append(row);return bubble}
function copyMessage(text){navigator.clipboard?.writeText(text).then(()=>toast('Copied')).catch(()=>toast('Copy unavailable'))}
function current(){return conversations.find(c=>c.id===currentId)}
function loadChat(id){const c=conversations.find(x=>x.id===id);if(!c)return;currentId=id;title.textContent=c.title||'New chat';panel.classList.add('hidden');messages.innerHTML='';c.messages.forEach(m=>messageNode(m.role,m.text,m.meta));renderHistory();closeMobile();requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}
function newChat(){currentId=null;title.textContent='New chat';panel.classList.add('hidden');welcome();renderHistory();closeMobile()}
function ensureChat(firstText){if(currentId&&current())return current();const c={id:uid(),title:firstText.slice(0,48),messages:[]};conversations.push(c);currentId=c.id;return c}
function addStored(c,role,text,meta=''){c.messages.push({role,text,meta});save();renderHistory()}
async function sendMessage(text){if(busy||!text.trim())return;const clean=text.trim(),c=ensureChat(clean);if(messages.querySelector('.welcome'))messages.innerHTML='';addStored(c,'user',clean);messageNode('user',clean);const bubble=messageNode('assistant','');bubble.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';busy=true;send.disabled=true;input.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});const j=await r.json();if(!r.ok)throw new Error(j.error||j.message||'Request failed');const answer=j.data??j.message??JSON.stringify(j,null,2);bubble.innerHTML=renderMarkdown(answer);const meta=[j.provider,j.model,j.latency_ms!=null?j.latency_ms+'ms':null].filter(Boolean).join(' · ');if(meta){const row=bubble.parentElement,m=document.createElement('div');m.className='meta';m.innerHTML='<span>'+escapeHtml(meta)+'</span>';const cp=document.createElement('button');cp.type='button';cp.className='copy-btn';cp.textContent='Copy';cp.onclick=()=>copyMessage(answer);m.append(cp);row.append(m)}addStored(c,'assistant',answer,meta);if(j.run_id)events(j.run_id)}catch(e){const msg='Request failed: '+e.message;bubble.innerHTML='<strong>Request failed.</strong><br>'+escapeHtml(e.message);addStored(c,'assistant',msg)}finally{busy=false;input.disabled=false;updateSend();input.focus();requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,190)+'px'}
function updateSend(){send.disabled=busy||!input.value.trim()}
function closeMobile(){sidebar.classList.remove('open');overlay.classList.add('hidden')}
function openPanel(name){panel.classList.remove('hidden');panel.innerHTML='<div class="panel-inner"><h2 class="panel-title">'+escapeHtml(name)+'</h2><p class="panel-subtitle">Barberian workspace</p><div class="cards"><div class="card"><span class="card-title">'+escapeHtml(name)+'</span><span class="card-text">Module interface is connected to the Barberian application shell.</span></div><div class="card"><span class="card-title">Status</span><span class="card-text">Available through the Barberian API.</span></div></div></div>';closeMobile()}
async function health(){try{const r=await fetch('/api/health',{cache:'no-store'});if(!r.ok)throw new Error();status.classList.add('online');status.innerHTML='<span class="status-dot"></span><span>Online</span>'}catch{status.classList.remove('online');status.innerHTML='<span class="status-dot"></span><span>Offline</span>'}}
async function events(runId){try{await fetch('/api/events?run_id='+encodeURIComponent(runId),{cache:'no-store'})}catch{}}
$('#newChat').onclick=newChat;
$('#mobileMenu').onclick=()=>{sidebar.classList.add('open');overlay.classList.remove('hidden')};
overlay.onclick=closeMobile;
$('#desktopToggle').onclick=()=>sidebar.classList.toggle('collapsed');
$('#themeToggle').onclick=()=>toast('AMOLED dark mode is active');
$('#attach').onclick=()=>toast('File upload coming soon');
document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>openPanel(b.dataset.module));
$('#composer').onsubmit=e=>{e.preventDefault();const text=input.value;input.value='';resize();updateSend();sendMessage(text)};
input.addEventListener('input',()=>{resize();updateSend()});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});
welcome();renderHistory();health();setInterval(health,30000);
</script>
</body>
</html>

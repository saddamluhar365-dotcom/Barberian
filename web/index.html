<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Barberian universal AI agent">
<title>Barberian</title>
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Chat navigation">
    <div class="sidebar-head">
      <div class="brand"><span class="brand-mark">B</span><span class="brand-name">Barberian</span></div>
      <button class="action" data-action="new-chat" type="button" aria-label="Start a new chat"><span class="icon-text">＋</span><span>New chat</span></button>
    </div>
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input class="search" id="searchInput" data-action="search" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off">
    </div>
    <div class="history" id="history" aria-label="Chat history"></div>
    <div class="sidebar-foot">
      <button class="nav" data-action="settings" type="button" aria-label="Open settings"><span>⚙</span><span>Settings</span></button>
      <button class="nav danger" data-action="clear-chat" type="button" aria-label="Clear local chat history"><span>⌫</span><span>Clear history</span></button>
    </div>
  </aside>
  <div class="overlay hidden" id="overlay" aria-hidden="true"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon mobile-only" id="mobileMenu" data-action="mobile-menu" type="button" aria-label="Open navigation">☰</button>
      <button class="icon desktop-only" id="desktopToggle" data-action="desktop-toggle" type="button" aria-label="Collapse navigation">◀</button>
      <div class="topbar-title" id="title">New chat</div>
      <div class="spacer"></div>
      <div class="status" id="status" aria-live="polite"><span class="status-dot"></span><span>Checking</span></div>
      <button class="icon" id="focusToggle" data-action="focus-toggle" type="button" aria-label="Toggle focus mode">⌗</button>
      <button class="icon" id="themeToggle" data-action="theme-toggle" type="button" aria-label="Keep AMOLED black mode">◐</button>
    </header>
    <section class="chat" id="chat" aria-label="Conversation">
      <div class="messages" id="messages"></div>
    </section>
    <section class="panel hidden" id="panel" aria-label="Settings" aria-hidden="true">
      <div class="panel-inner">
        <div class="panel-head"><div><h2>Settings</h2><p class="panel-sub">Local interface preferences for this browser.</p></div><button class="close" data-action="close-settings" type="button" aria-label="Close settings">×</button></div>
        <div class="settings">
          <label class="setting"><span><span class="setting-title">AMOLED black</span><span class="setting-desc">Keep the interface on pure black.</span></span><span class="switch"><input id="blackMode" type="checkbox" checked><span></span></span></label>
          <label class="setting"><span><span class="setting-title">Focus mode</span><span class="setting-desc">Hide navigation for a distraction-free chat.</span></span><span class="switch"><input id="focusMode" type="checkbox"><span></span></span></label>
          <label class="setting"><span><span class="setting-title">Enter sends</span><span class="setting-desc">Press Enter to send; Shift+Enter creates a new line.</span></span><span class="switch"><input id="enterSend" type="checkbox" checked><span></span></span></label>
          <label class="setting"><span><span class="setting-title">Local history</span><span class="setting-desc">Store conversations only in this browser.</span></span><span class="switch"><input id="localHistory" type="checkbox" checked><span></span></span></label>
          <button class="danger" id="settingsClear" data-action="clear-settings-history" type="button">Delete local history</button>
        </div>
        <div class="about">Barberian frontend uses the existing same-origin API. Attachments are displayed locally only; there is no upload endpoint.</div>
      </div>
    </section>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <div class="attachment hidden" id="attachment"><span id="attachmentName"></span><button class="remove" id="removeAttachment" data-action="remove-attachment" type="button" aria-label="Remove selected file">×</button></div>
        <div class="composer-box">
          <input id="fileInput" type="file" hidden>
          <button class="composer-btn" data-action="attach" type="button" aria-label="Select a local attachment">＋</button>
          <textarea id="input" rows="1" maxlength="100000" placeholder="Message Barberian…" aria-label="Message Barberian"></textarea>
          <button class="composer-btn stop hidden" data-action="stop" type="button" aria-label="Stop response">■</button>
          <button class="composer-btn send" data-action="send" type="submit" aria-label="Send message">↑</button>
        </div>
        <div class="hint">Barberian can make mistakes. Verify important information.</div>
      </form>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</body>
</html>

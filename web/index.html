<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barberian</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;overflow:hidden}aside{width:248px;flex:none;border-right:1px solid #1c1c1c;background:#050505;padding:14px;overflow:auto;transition:width .2s}aside.collapsed{width:64px}aside.collapsed .label,aside.collapsed .brand{display:none}.brand{font-weight:700;font-size:18px;padding:8px 10px 16px}.nav{display:grid;gap:3px}.nav button{background:transparent;border:0;color:#999;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}.nav button:hover,.nav button.active{background:#171717;color:#fff}.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100vh}.top{height:56px;border-bottom:1px solid #1c1c1c;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top button{background:transparent;color:#aaa;border:1px solid #292929;border-radius:8px;padding:7px 10px}.status{font-size:12px;color:#777}.chat{flex:1;overflow:auto}.inner{max-width:900px;margin:auto;padding:28px 20px 120px}.welcome{text-align:center;color:#777;margin-top:18vh}.message{display:flex;margin:20px 0}.message.user{justify-content:flex-end}.bubble{max-width:82%;padding:12px 15px;border-radius:14px;white-space:pre-wrap;line-height:1.55}.user .bubble{background:#181818}.assistant .bubble{border:1px solid #222;background:#070707}.meta{font-size:11px;color:#666;margin-top:7px}.composer{position:fixed;bottom:0;left:248px;right:0;padding:14px 20px 18px;background:linear-gradient(transparent,#000 30%)}.box{max-width:900px;margin:auto;display:flex;gap:8px;background:#111;border:1px solid #303030;border-radius:15px;padding:7px}.box textarea{flex:1;background:transparent;color:#fff;border:0;outline:0;resize:none;padding:10px;font:inherit;min-height:40px;max-height:160px}.box button{align-self:flex-end;background:#fff;color:#000;border:0;border-radius:10px;padding:10px 15px;font-weight:650;cursor:pointer}.panel{display:none;position:absolute;inset:56px 0 0 0;background:#000;overflow:auto;padding:30px}.panel.open{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #222;border-radius:12px;padding:15px;background:#080808}.muted{color:#777}@media(max-width:700px){aside{display:none}.composer{left:0}.bubble{max-width:94%}}
</style>
</head>
<body>
<aside id="side"><div class="brand">Barberian</div><div class="nav" id="nav"></div></aside>
<section class="main">
<header class="top"><button id="toggle">☰</button><strong id="title">New Chat</strong><span class="status" id="status">checking…</span></header>
<div class="chat" id="chat"><div class="inner" id="messages"><div class="welcome">Ask Barberian to research, plan, code, create, automate, or execute.</div></div></div>
<div class="panel" id="panel"></div>
<div class="composer"><form class="box" id="form"><textarea id="input" rows="1" placeholder="Tell Barberian what to do…"></textarea><button>Send</button></form></div>
</section>
<script>
const modules=['New Chat','Chats','Projects','Files','Tasks','MCP','Skills','APIs','Models','Tools','Research','Media','Code','GitHub','Sandbox','Logs','Usage','Security','Settings'];
const nav=document.querySelector('#nav'),side=document.querySelector('#side'),messages=document.querySelector('#messages'),input=document.querySelector('#input'),status=document.querySelector('#status'),panel=document.querySelector('#panel'),title=document.querySelector('#title');
modules.forEach((name,i)=>{const b=document.createElement('button');b.innerHTML=`<span>${i===0?'＋':'◦'}</span> <span class="label">${name}</span>`;b.onclick=()=>openModule(name);nav.append(b)});
document.querySelector('#toggle').onclick=()=>side.classList.toggle('collapsed');
function add(role,text,meta=''){const w=messages.querySelector('.welcome');if(w)w.remove();const row=document.createElement('div');row.className='message '+role;const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.append(bubble);if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;bubble.append(m)}messages.append(row);document.querySelector('#chat').scrollTop=999999}
async function getJson(path){const r=await fetch(path);return await r.json()}
async function health(){try{const j=await getJson('/api/health');status.textContent=j.status||'online'}catch{status.textContent='offline'}}
async function openModule(name){title.textContent=name;if(name==='New Chat'){panel.classList.remove('open');return}panel.classList.add('open');panel.innerHTML='<h2>'+name+'</h2><p class="muted">Loading…</p>';try{let data;if(name==='APIs'||name==='Models')data=await getJson('/api/providers');else if(name==='MCP')data=await getJson('/api/mcp');else if(name==='Skills')data=await getJson('/api/skills');else if(name==='Tools'||name==='Settings'||name==='Security')data=await getJson('/api/status');else if(name==='Research')data=await getJson('/api/capabilities');else data={ok:true,items:[]};renderPanel(name,data)}catch(e){panel.innerHTML='<h2>'+name+'</h2><p class="muted">Unable to load module.</p>'}}
function renderPanel(name,data){const items=data.items||[];panel.innerHTML=`<h2>${name}</h2><div class="cards">${items.length?items.map(x=>`<div class="card"><strong>${typeof x==='string'?x:(x.name||x.provider||'item')}</strong><p class="muted">${typeof x==='string'?'registered':JSON.stringify(x)}</p></div>`).join(''):`<div class="card muted">No registered items.</div>`}</div>`}
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';panel.classList.remove('open');title.textContent='New Chat';add('user',text);add('assistant','Working…');const pending=messages.lastElementChild;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const j=await r.json();pending.querySelector('.bubble').textContent=j.data??j.message??JSON.stringify(j,null,2);if(j.provider)pending.querySelector('.bubble').insertAdjacentHTML('beforeend',`<div class="meta">${j.provider}${j.model?' · '+j.model:''}${j.latency_ms!=null?' · '+j.latency_ms+'ms':''}</div>`)}catch(err){pending.querySelector('.bubble').textContent='Request failed: '+err.message}};
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});health();setInterval(health,30000);
</script>
</body></html>
